name: Update Claude Code Documentation

on:
  schedule:
    # Run every 3 hours (at 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Fetch latest documentation
      id: fetch-docs
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
      run: |
        uv run scripts/fetch_claude_docs.py || echo "fetch_failed=true" >> $GITHUB_OUTPUT
      continue-on-error: true

    - name: Check for changes
      id: verify-changed-files
      run: |
        echo "docs_changed=false" >> $GITHUB_OUTPUT
        echo "any_changed=false" >> $GITHUB_OUTPUT

        if git status --porcelain -- plugins/ccdocs/skills/docs/references/ | grep -q .; then
          echo "docs_changed=true" >> $GITHUB_OUTPUT
        fi

        if git status --porcelain -- \
          plugins/ccdocs/skills/docs/references/ \
          plugins/ccdocs/skills/docs/docs_manifest.json \
          plugins/ccdocs/.claude-plugin/plugin.json | grep -q .; then
          echo "any_changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Compute release version
      if: steps.verify-changed-files.outputs.docs_changed == 'true'
      id: release-version
      run: |
        git fetch --tags --quiet
        YEAR=$(date -u +'%Y')
        MONTH=$(date -u +'%m')
        MONTH=${MONTH#0}
        PREFIX="${YEAR}.${MONTH}"
        LAST_TAG=$(git tag -l "${PREFIX}.*" | sort -V | tail -n 1)
        if [ -z "$LAST_TAG" ]; then
          PATCH=1
        else
          PATCH=$(( ${LAST_TAG##*.} + 1 ))
        fi
        VERSION="${PREFIX}.${PATCH}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Update plugin version
      if: steps.verify-changed-files.outputs.docs_changed == 'true'
      env:
        RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
      run: |
        python3 - <<'PY'
        import json
        from pathlib import Path
        import os

        plugin_path = Path("plugins/ccdocs/.claude-plugin/plugin.json")
        data = json.loads(plugin_path.read_text())
        data["version"] = os.environ["RELEASE_VERSION"]
        plugin_path.write_text(json.dumps(data, indent=2) + "\n")
        PY

    - name: Generate commit message
      if: steps.verify-changed-files.outputs.any_changed == 'true'
      id: commit-msg
      env:
        DOCS_CHANGED: ${{ steps.verify-changed-files.outputs.docs_changed }}
        RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
      run: |
        # Stage changes to see what will be committed
        git add -A plugins/ccdocs/skills/docs/references/ plugins/ccdocs/skills/docs/docs_manifest.json plugins/ccdocs/.claude-plugin/plugin.json

        # Get list of changed doc files
        CHANGED_FILES=$(git diff --name-status --cached | grep "^M" | cut -f2 | grep -E "\.md$" | sed 's|plugins/ccdocs/skills/docs/references/||' | paste -sd ", " -)
        ADDED_FILES=$(git diff --name-status --cached | grep "^A" | cut -f2 | grep -E "\.md$" | sed 's|plugins/ccdocs/skills/docs/references/||' | paste -sd ", " -)
        DELETED_FILES=$(git diff --name-status --cached | grep "^D" | cut -f2 | grep -E "\.md$" | sed 's|plugins/ccdocs/skills/docs/references/||' | paste -sd ", " -)

        if [ "$DOCS_CHANGED" = "true" ]; then
          COMMIT_MSG="Update Claude Code docs - $(date +'%Y-%m-%d') | Release: $RELEASE_VERSION"

          if [ -n "$CHANGED_FILES" ]; then
            COMMIT_MSG="$COMMIT_MSG | Updated: $CHANGED_FILES"
          fi

          if [ -n "$ADDED_FILES" ]; then
            COMMIT_MSG="$COMMIT_MSG | Added: $ADDED_FILES"
          fi

          if [ -n "$DELETED_FILES" ]; then
            COMMIT_MSG="$COMMIT_MSG | Removed: $DELETED_FILES"
          fi
        else
          COMMIT_MSG="Update Claude Code docs manifest - $(date +'%Y-%m-%d')"
        fi

        echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT

    - name: Commit and push if changed
      if: steps.verify-changed-files.outputs.any_changed == 'true'
      env:
        RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        # Files already staged in previous step
        git commit -m "${{ steps.commit-msg.outputs.message }}"
        git push
        if [ "${{ steps.verify-changed-files.outputs.docs_changed }}" = "true" ]; then
          git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
          git push origin "$RELEASE_VERSION"
        fi

    - name: Create GitHub release
      if: steps.verify-changed-files.outputs.docs_changed == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        RELEASE_NOTES: ${{ steps.commit-msg.outputs.message }}
      run: |
        gh release create "$RELEASE_VERSION" \
          --title "$RELEASE_VERSION" \
          --notes "$RELEASE_NOTES"

    - name: Create issue on failure
      if: steps.fetch-docs.outputs.fetch_failed == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const date = new Date().toISOString().split('T')[0];
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Documentation update failed - ${date}`,
            body: `The automated documentation update failed on ${date}.\n\nPlease check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
            labels: ['bug', 'automation']
          })
